on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  # Everything test.yml runs, on Linux and Windows.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its files
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the tag (sbt-dynver)

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'sbt'

      - name: Publish to Maven Central (the sbta jar the sbta scripts download)
        timeout-minutes: 20
        run: ./sbta --server --no-server --batch ci-release
        env:
          CI_RELEASE: publishSigned
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Build the sbta jar and scripts
        timeout-minutes: 15
        run: |
          ./sbta --server --no-server --batch sbtaDist
          ls -la target/out/jvm/u/sbta/sbta-dist

      - name: GitHub release with the sbta jar and scripts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: target/out/jvm/u/sbta/sbta-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
